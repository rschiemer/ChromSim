# mAb with a high-molecular-weight (HMW, dimer) impurity on a generic CEX resin, linear
# salt-gradient elution. Transport parameters are illustrative (see Tutorial 01); the SMA
# parameters are a first guess that Tutorial 03 calibrates against the data in tests/data/.
schema_version: 1
name: CEX_mAb_HMW_LGE
components:
  - {name: salt}
  - {name: mAb, mw_kDa: 148, extinction_coeff_L_per_g_cm: 1.4}
  - {name: HMW, mw_kDa: 296, extinction_coeff_L_per_g_cm: 1.4}
column:
  model: GRM
  length: 20 cm
  diameter: 0.5 cm
  axial_dispersion: 2e-7 m^2/s
  film_diffusion: {salt: 1e-4 m/s, mAb: 2e-6 m/s, HMW: 1.5e-6 m/s}
  pore_diffusion: {salt: 1e-10 m^2/s, mAb: 5e-12 m^2/s, HMW: 3e-12 m^2/s}
resin: {name: Generic CEX, particle_radius: 45 um, ionic_capacity: 1200 mM,
        col_porosity: 0.36, par_porosity: 0.85}
system: {tubing_volume: 0.25 mL, mixer_volume: 0.2 mL, uv_delay_volume: 0.1 mL,
         conductivity_delay_volume: 0.15 mL}
isotherm:
  model: SMA
  parameters:
    mAb: {k_eq: 1.0e-2, nu: 6.0, sigma: 30.0, k_kin: 1.0e+2}
    HMW: {k_eq: 1.0e-2, nu: 7.5, sigma: 50.0, k_kin: 1.0e+2}
method:
  - {name: equilibrate, duration: 5 CV,  flow: 150 cm/h, inlet: {salt: 50 mM}}
  - {name: load,        duration: 10 mL, flow: 150 cm/h, inlet: {salt: 50 mM, mAb: 1.9 g/L, HMW: 0.1 g/L}}
  - {name: wash,        duration: 5 CV,  flow: 150 cm/h, inlet: {salt: 50 mM}}
  - {name: elute,       duration: 20 CV, flow: 150 cm/h, inlet: {salt: 50 mM}, inlet_end: {salt: 500 mM}}
  - {name: strip,       duration: 5 CV,  flow: 150 cm/h, inlet: {salt: 1000 mM}}
solver: {backend: cadet, n_col: 50, n_par: 12}
