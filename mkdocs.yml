site_name: ChromSim
site_description: Mechanistic chromatography modeling toolbox built on CADET.
repo_url: ""
docs_dir: docs

theme:
  name: material
  features:
    - navigation.sections
    - content.code.copy

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.snippets:
      check_paths: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: numpy
            show_source: false

nav:
  - Home: index.md
  - Getting started: getting_started.md
  - User guide:
      - Project files and units: user_guide/project_files.md
      - Simulating a project: user_guide/simulation.md
      - Experimental data: user_guide/experimental_data.md
      - Calibrating a model: user_guide/calibration.md
  - How-to:
      - Add a chromatogram importer: how_to/add_importer.md
  - Theory:
      - Isotherms:
          - theory/isotherms/index.md
          - Linear: theory/isotherms/linear.md
          - Langmuir: theory/isotherms/langmuir.md
          - Steric mass action: theory/isotherms/sma.md
      - Yamamoto method: theory/yamamoto.md
  - API reference: api/index.md
  - Decisions:
      - decisions/index.md
      - 0001 CADET-Process as process layer: decisions/0001-use-cadet-process.md
      - 0002 pixi environment: decisions/0002-pixi.md
      - 0004 Units policy: decisions/0004-units-policy.md
      - 0005 CADET backend conventions: decisions/0005-cadet-backend-conventions.md
      - 0006 openpyxl: decisions/0006-openpyxl.md
      - 0007 Calibration conventions: decisions/0007-calibration-conventions.md

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
