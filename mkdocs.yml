site_name: ChromSim
site_description: Mechanistic chromatography modeling toolbox built on CADET.
repo_url: ""
docs_dir: docs

theme:
  name: material
  features:
    - navigation.sections
    - content.code.copy

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.snippets:
      check_paths: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: numpy
            show_source: false

nav:
  - Home: index.md
  - Getting started: getting_started.md
  - User guide:
      - Project files and units: user_guide/project_files.md
      - Simulating a project: user_guide/simulation.md
      - Experimental data: user_guide/experimental_data.md
      - Calibrating a model: user_guide/calibration.md
      - Fractionation and process optimization: user_guide/process_optimization.md
      - Web UI, workspaces and jobs: user_guide/web_ui.md
  - How-to:
      - Add an isotherm: how_to/add_isotherm.md
      - Add an optimizer: how_to/add_optimizer.md
      - Add a chromatogram importer: how_to/add_importer.md
  - Theory:
      - Isotherms:
          - theory/isotherms/index.md
          - Linear: theory/isotherms/linear.md
          - Langmuir: theory/isotherms/langmuir.md
          - Steric mass action: theory/isotherms/sma.md
          - Generalized ion exchange: theory/isotherms/giex.md
          - Mobile phase modulator: theory/isotherms/mpm.md
          - HIC constant water activity: theory/isotherms/hic_constant_water_activity.md
          - HIC water on hydrophobic surfaces: theory/isotherms/hic_water_on_hydrophobic_surfaces.md
          - Bi-Langmuir: theory/isotherms/bi_langmuir.md
          - Mixed-mode Langmuir (Python): theory/isotherms/mixed_mode_langmuir.md
          - Colloidal (Xu & Lenhoff): theory/isotherms/colloidal.md
          - Colloidal particle adsorption (Python): theory/isotherms/cpa.md
      - Colloidal adsorption models: theory/colloidal_models.md
      - Yamamoto method: theory/yamamoto.md
  - API reference: api/index.md
  - Decisions:
      - decisions/index.md
      - 0001 CADET-Process as process layer: decisions/0001-use-cadet-process.md
      - 0002 pixi environment: decisions/0002-pixi.md
      - 0003 UI framework (NiceGUI): decisions/0003-ui-framework.md
      - 0004 Units policy: decisions/0004-units-policy.md
      - 0005 CADET backend conventions: decisions/0005-cadet-backend-conventions.md
      - 0006 openpyxl: decisions/0006-openpyxl.md
      - 0007 Calibration conventions: decisions/0007-calibration-conventions.md
      - 0008 Reference backend: decisions/0008-reference-backend.md
      - 0009 Optimizer interface: decisions/0009-optimizer-interface.md
      - 0010 Fractionation: decisions/0010-fractionation.md
      - 0011 Colloidal isotherms: decisions/0011-colloidal-isotherms.md

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
